name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ['1.2.18']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test (builds workspace deps via pretest hook)
        run: bun run test -- --run

      - name: Build all packages
        run: |
          bun run --cwd packages/engine build
          bun run --cwd packages/adapter build
          bun run --cwd packages/core build
          bun run --cwd packages/styles build
          bun run --cwd packages/statusbar-vanilla build
          bun run --cwd packages/statusbar-react build

      - name: Check bundle size budget
        if: matrix.os == 'ubuntu-latest'
        run: bun run size

  release-dry-run:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'
      - run: bun install --frozen-lockfile
      - name: Publish dry-run (@prose-motions/core)
        run: bun run --cwd packages/core prepublishOnly && npm pack --dry-run --workspace @prose-motions/core || true
